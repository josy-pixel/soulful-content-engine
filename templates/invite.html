<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Set your password — Soulful Content Engine</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet" />
  <link href="{{ url_for('static', filename='css/mobile.css') }}" rel="stylesheet" />
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f5f5f7; }
    .login-card { width: 100%; max-width: 400px; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">Set your password</h1>
        <p class="text-muted mb-3">Welcome, <strong>{{ email }}</strong>. Choose a password to activate your account.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="alert alert-{{ 'danger' if category in ('error','danger') else 'success' }} py-2">{{ message }}</div>
          {% endfor %}
        {% endwith %}

        <form method="post" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <div class="mb-3">
            <label class="form-label">New password</label>
            <input type="password" name="password" class="form-control" minlength="12" required autocomplete="new-password">
            <small class="text-muted">At least 12 characters.</small>
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm password</label>
            <input type="password" name="confirm" class="form-control" minlength="12" required autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary w-100">Activate account</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
