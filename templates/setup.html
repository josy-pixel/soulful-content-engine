<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>First-time setup — Soulful Content Engine</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet" />
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f5f5f7; }
    .setup-card { width: 100%; max-width: 400px; }
    .brand-mark { font-size: 1.6rem; }
  </style>
</head>
<body>
  <div class="setup-card">
    <div class="text-center mb-4">
      <div class="brand-mark">✦ <strong>Soulful</strong></div>
      <div class="text-muted"><small>Content Engine</small></div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h5 class="card-title mb-1">Create your admin account</h5>
        <p class="text-muted small mb-3">This one-time setup runs only until the first account is created. Do it now.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="alert alert-{{ 'danger' if category == 'danger' else 'success' if category == 'success' else 'info' }} py-2 small">{{ message }}</div>
          {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('setup_admin') }}" autocomplete="off">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <div class="mb-3">
            <label class="form-label small">Setup code</label>
            <input type="text" name="setup_token" class="form-control" required autofocus autocomplete="off">
          </div>
          <div class="mb-3">
            <label class="form-label small">Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label small">Password <span class="text-muted">(min 8 characters)</span></label>
            <input type="password" name="password" class="form-control" minlength="8" required>
          </div>
          <div class="mb-3">
            <label class="form-label small">Confirm password</label>
            <input type="password" name="confirm" class="form-control" minlength="8" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Create admin &amp; continue</button>
        </form>
      </div>
    </div>

    <p class="text-center text-muted mt-3"><small>Powered by Claude AI</small></p>
  </div>
</body>
</html>
